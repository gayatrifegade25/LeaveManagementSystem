name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/LeaveManagement.API/LeaveManagement.API.csproj

      - name: Build
        run: dotnet build backend/LeaveManagement.API/LeaveManagement.API.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test backend/LeaveManagement.Tests/LeaveManagement.Tests.csproj --configuration Release
